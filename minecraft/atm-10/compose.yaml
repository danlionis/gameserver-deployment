services:
  server:
    image: itzg/minecraft-server
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      MEMORY: "10G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:-supersecret}
      ENABLE_QUERY: "true"
      MOTD: "Server is da"
      DIFFICULTY: normal
      MODE: survival
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: all-the-mods-10
      ALLOW_FLIGHT: TRUE
      WHITELIST: |
        Sev_Fix
        miritzu
        FashleHD
        MrEnd_MC
        Sushirolle3_0
      OPS: |
        FashleHD
    networks:
      - mc-router
    volumes:
      - data:/data
    labels:
      mc-router.host: "atmx.mc.dummsuff.com"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 10G

    # no backup, modpack includes its own backups

volumes:
  data:

networks:
  mc-router:
    external: true
