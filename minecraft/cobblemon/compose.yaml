services:
  server:
    image: itzg/minecraft-server:java17
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      MEMORY: "7G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:-supersecret}
      ENABLE_QUERY: "true"
      MOTD: "fabi boof"
      DIFFICULTY: normal
      MODE: survival
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: society-sunlit-cobblemon
      ALLOW_FLIGHT: TRUE
      WHITELIST: |
        FashleHD
        Sev_Fix
        Sushirolle3_0
        miritzu
        RusskiCraft
        TheRealWurst
        xsmuli
      OPS: |
        FashleHD
    volumes:
      - data:/data
    networks:
      - mc-router
    labels:
      mc-router.host: "cobblemon.mc.dummsuff.com"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 10GB

  backup:
    image: itzg/mc-backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "24h"
      BACKUP_RETENTION_DAYS: "3"
      INITIAL_DELAY: "180s"
      RCON_HOST: server
      TAR_COMPRESS_METHOD: zstd
      RCON_PASSWORD: ${RCON_PASSWORD:-supersecret}
      TZ: "Europe/Berlin"
    volumes:
      - data:/data:ro
      - backups:/backups
    networks:
      - mc-router
    depends_on:
      - server

volumes:
  data:
  backups:

networks:
  mc-router:
    external: true
