services:
  server:
    image: itzg/minecraft-server:java17
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      MEMORY: "7G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:-supersecret}
      ENABLE_QUERY: "true"
      MOTD: "fabi boof"
      DIFFICULTY: normal
      MODE: survival
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: society-sunlit-cobblemon
      ALLOW_FLIGHT: TRUE
      WHITELIST: |
        FashleHD
        Sev_Fix
        Sushirolle3_0
        miritzu
        RusskiCraft
        Iffu
        TheRealWurst
      OPS: |
        FashleHD
    volumes:
      - data:/data
    networks:
      - mc-router
    labels:
      mc-router.host: "cobblemon.mc.dummsuff.com"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 10GB

volumes:
  data:

networks:
  mc-router:
    external: true
